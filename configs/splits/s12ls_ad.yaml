# S12LS-AD: LD patches (>= 50 annotated px) as positives, patches without any annotation as negatives
# (1-49 px dropped), single-event inventories only, event_date in every entry, norm per pool.
# Splits are pinned to this task's own splits_aligned.json (original release: git 590a726).
base_dir: path/to/Sen12Landslides
split_settings:
  input_dir: ${base_dir}/data/data_harmonized
  output_dir: ${base_dir}/tasks/S12LS-AD/harmonized
  export_geodataframe: true
  clip_data: false
  fixed_splits_json: ${base_dir}/tasks/S12LS-AD/harmonized/splits_aligned.json
  filter_criteria:
    min_annotated_pixel: 0
    min_positive_pixel: 50
    single_event_only: true
    include_patterns: []
    exclude_patterns: ["usa_alaska", "nepal"]
    satellites: ["s1asc", "s1dsc", "s2"]
    annotated_only: false
    non_annotated_only: false
    annotated_ratio: 0.8   # kept for parity with the original config; unused by create_splits.py
    min_confidence: null
    max_confidence: null
  norm_pools: [positive, negative]
  test_size: 0.2
  val_size: 0.2
  seed: 42
  n_workers: 40
