# S12LS-AD -- anomaly detection: annotated AND non-annotated patches.
# The filter criteria intentionally differ from S12LS-LD: annotated_only=false
# and min_annotated_pixel=0 are what admit the non-annotated patches at all.
# exclude_patterns still matches LD, so usa_alaska/nepal stay out of both tasks.
base_dir: path/to/Sen12Landslides
split_settings:
  input_dir: ${base_dir}/data/data_harmonized
  output_dir: ${base_dir}/tasks/S12LS-AD/harmonized
  export_geodataframe: true
  clip_data: false
  fixed_splits_json: ${base_dir}/tasks/S12LS-LD/harmonized/splits_aligned.json
  filter_criteria:
    min_annotated_pixel: 0
    include_patterns: []
    exclude_patterns: ["usa_alaska", "nepal"]
    satellites: ["s1asc", "s1dsc", "s2"]
    annotated_only: false
    non_annotated_only: false
    annotated_ratio: 0.8   # kept for parity with the original config; unused by create_splits.py
    min_confidence: null
    max_confidence: null
  test_size: 0.2
  val_size: 0.2
  seed: 42
  n_workers: 40
