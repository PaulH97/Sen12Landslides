# Defaults only -- pick a task config instead of editing this file:
#
#   python src/data/create_splits.py --config-name s12ls_ld            # S12LS-LD (reference task)
#   python src/data/create_splits.py --config-name s12ls_ad            # S12LS-AD (splits pinned to LD)
#   python src/data/create_splits.py --config-name s12ls_ad_unaligned  # superseded AD variant
#
# Each task config documents its own raw/harmonized variants. Running
# create_splits.py without --config-name uses the values below, which mirror
# s12ls_ld.yaml (the reference task) so the default stays reproducible.
base_dir: path/to/Sen12Landslides
split_settings:
  input_dir: ${base_dir}/data/data_harmonized
  output_dir: ${base_dir}/tasks/S12LS-LD/harmonized
  export_geodataframe: true
  clip_data: false
  fixed_splits_json: null
  filter_criteria:
    min_annotated_pixel: 50 # Minimum annotated pixels to include a sample
    include_patterns: [] # Used to only include files from these inventories e.g., ["italy", "hiroshima"]
    exclude_patterns: ["usa_alaska", "nepal"]  # Used to exclude all files from these inventories e.g., ["newzealand", "kyrgyzstan1"]
    satellites: ["s1asc", "s1dsc", "s2"]  # e.g., ["s1asc", "s1dsc", "s2"]
    annotated_only: true        # Keep only annotated files
    non_annotated_only: false   # Keep only non-annotated files
    annotated_ratio: 0.8       # If mixing both, ratio of annotated (0.0-1.0)
    min_confidence: 1.0  # e.g., 0.7 to keep only patches with high-confidence dates
    max_confidence: null  # e.g., 0.5 to keep only patches with low-confidence dates
  test_size: 0.2   # 20% for testing
  val_size: 0.2    # 20% of the 80% training data for validation
  seed: 42
  n_workers: 40
