# S12LS-LD -- landslide detection: only annotated patches (>50 annotated pixels).
# This is the reference task: its splits_aligned.json is what S12LS-AD pins its
# shared patches to (see s12ls_ad_aligned.yaml).
base_dir: path/to/Sen12Landslides
split_settings:
  input_dir: ${base_dir}/data/data_harmonized
  output_dir: ${base_dir}/tasks/S12LS-LD/harmonized
  export_geodataframe: true
  clip_data: false
  fixed_splits_json: null      # LD defines the reference; nothing to pin against
  filter_criteria:
    min_annotated_pixel: 50
    include_patterns: []
    exclude_patterns: ["usa_alaska", "nepal"]
    satellites: ["s1asc", "s1dsc", "s2"]
    annotated_only: true
    non_annotated_only: false
    annotated_ratio: null
    min_confidence: null
    max_confidence: null
  test_size: 0.2
  val_size: 0.2
  seed: 42
  n_workers: 40
